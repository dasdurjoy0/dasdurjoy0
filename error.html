<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Durjoy Das - ERROR</title>
<style>
    *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    :root {
        --bg-deep: #080B08;
        --bg-surface: #151B15;
        --green: #22C55E;
        --green-soft: #86EFAC;
        --text: #E5E7EB;
        --text-dim: #9CA3AF;
        --border: rgba(134, 239, 172, 0.12);
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        min-height: 100vh;
        background: var(--bg-deep);
        color: var(--text);
        font-family: 'Inter', sans-serif;
        font-weight: 400;
        line-height: 1.6;
        overflow-x: hidden;
    }

    /* ── PARTICLE CANVAS ── */
    #particles {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
    }

    /* ── CONTENT ── */
    .error-container {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        text-align: center;
    }

    h1 {
        font-size: 3rem;
        color: var(--green);
        text-align: center;
        margin-top: 20vh;

    }

    p {
        font-size: 1.2rem;
        color: var(--text-dim);
        text-align: center;
        margin-top: 1rem;

    }

    .gif {
        display: block;
        width: 400px;
        margin: 3rem auto 0;
        background-color: var(--green-soft);
        mix-blend-mode: color-burn;
    }

    button {
        display: block;
        margin: 2rem auto 0;
        padding: 0.5rem 1rem;
        font-size: 1rem;
        background-color: var(--green);
        color: var(--bg-deep);
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }
</style>

</head>
<body>
    <canvas id="particles" aria-hidden="true"></canvas>
    <h1>404 - Page Not Found</h1>
    <p>The page you are looking for ain't available right now.</p>

    <div>
        <span>
         <img src="assets/cat.gif" class="gif" alt="Confused cat">
        </span>
    </div>

    <button onclick="window.location.href='index.html'">Go Back Home</button>
<script>
    /* ── PARTICLE CANVAS ── */
    (() => {
        const canvas = document.getElementById('particles');

        // Prevent errors if the canvas isn't available.
        if (!canvas) return;

        const ctx = canvas.getContext('2d');

        if (!ctx) return;

        let W;
        let H;
        let nodes = [];
        let RAF;

        function resize() {
            const dpr = window.devicePixelRatio || 1;

            W = window.innerWidth;
            H = window.innerHeight;

            canvas.width = W * dpr;
            canvas.height = H * dpr;
            canvas.style.width = `${W}px`;
            canvas.style.height = `${H}px`;

            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        function Node() {
            this.x = Math.random() * W;
            this.y = Math.random() * H;
            this.vx = (Math.random() - 0.5) * 0.35;
            this.vy = (Math.random() - 0.5) * 0.35;
            this.r = Math.random() * 1.2 + 0.4;
        }

        function init() {
            resize();
            nodes = Array.from(
                { length: 70 },
                () => new Node()
            );
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);

            // Connections
            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    const dx = nodes[i].x - nodes[j].x;
                    const dy = nodes[i].y - nodes[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 140) {
                        ctx.beginPath();

                        ctx.strokeStyle =
                            `rgba(34, 197, 94, ${0.06 * (1 - dist / 140)})`;

                        ctx.lineWidth = 0.6;

                        ctx.moveTo(nodes[i].x, nodes[i].y);
                        ctx.lineTo(nodes[j].x, nodes[j].y);
                        ctx.stroke();
                    }
                }
            }

            // Dots
            nodes.forEach(node => {
                ctx.beginPath();

                ctx.arc(
                    node.x,
                    node.y,
                    node.r,
                    0,
                    Math.PI * 2
                );

                ctx.fillStyle = 'rgba(134, 239, 172, 0.25)';
                ctx.fill();

                node.x += node.vx;
                node.y += node.vy;

                if (node.x < 0 || node.x > W) {
                    node.vx *= -1;
                }

                if (node.y < 0 || node.y > H) {
                    node.vy *= -1;
                }
            });

            RAF = requestAnimationFrame(draw);
        }

        window.addEventListener('resize', resize);

        init();
        draw();

        // Clean up animation when the page is hidden.
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                cancelAnimationFrame(RAF);
            } else {
                draw();
            }
        });
    })();
</script>

</body> </html>
